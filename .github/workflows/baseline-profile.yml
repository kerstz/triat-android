name: Generate baseline profile

# Manual only: generation boots an emulator and runs a minified release build,
# about half an hour of runner time. The profile is uploaded as an artifact;
# a maintainer reviews it and commits it to app/src/release/generated/
# (docs/baseline-profile.md). Nothing is pushed from here.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate on a managed AOSP emulator
    # Only someone with write access can dispatch a workflow, so no separate
    # authorize job is needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Enable KVM for the emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Without the signing secrets the release variant is signed with the debug
    # key (app/build.gradle.kts), which is fine: the profile does not depend on
    # the signature.
    - name: Generate the release baseline profile
      run: >-
        ./gradlew :app:generateReleaseBaselineProfile
        -Ptriat.baselineProfile.managed
        -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
        -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20

    - name: Upload the generated profile
      uses: actions/upload-artifact@v4
      with:
        name: baseline-profile
        path: app/src/release/generated/baselineProfiles/
        if-no-files-found: error
        retention-days: 30
